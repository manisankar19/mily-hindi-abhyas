<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img">
  <rect width="880" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">
    <circle cx="24" cy="24" r="16" fill="#1f4fa0"/><text x="24" y="31">1</text>
    <circle cx="244" cy="24" r="16" fill="#1f4fa0"/><text x="244" y="31">2</text>
    <circle cx="464" cy="24" r="16" fill="#1f4fa0"/><text x="464" y="31">3</text>
    <circle cx="684" cy="24" r="16" fill="#1f4fa0"/><text x="684" y="31">4</text>
  </g>
  <g stroke="#ccc" stroke-width="1.5" fill="none">
    <rect x="4" y="4" width="212" height="292" rx="10"/><rect x="224" y="4" width="212" height="292" rx="10"/>
    <rect x="444" y="4" width="212" height="292" rx="10"/><rect x="664" y="4" width="212" height="292" rx="10"/>
  </g>

  <!-- 1: tulsi sprig: upright stem, paired small toothed oval leaves, slender flower spike -->
  <g transform="translate(110 0)">
    <path d="M0 285 L0 60" stroke="#4a6b2a" stroke-width="4"/>
    <!-- flower spike: whorls of tiny purple flowers -->
    <g fill="#9b6fb5" stroke="#6b4385" stroke-width="1">
      <ellipse cx="-6" cy="60" rx="5" ry="3"/><ellipse cx="6" cy="60" rx="5" ry="3"/>
      <ellipse cx="-7" cy="75" rx="5" ry="3"/><ellipse cx="7" cy="75" rx="5" ry="3"/>
      <ellipse cx="-8" cy="90" rx="5" ry="3"/><ellipse cx="8" cy="90" rx="5" ry="3"/>
      <ellipse cx="-8" cy="105" rx="5" ry="3"/><ellipse cx="8" cy="105" rx="5" ry="3"/>
      <ellipse cx="0" cy="50" rx="3" ry="5"/>
    </g>
    <!-- leaf pairs (toothed ovals) -->
    <g fill="#3e8f3a" stroke="#235c22" stroke-width="1.5">
      <path id="tl" d="M0 0 C10 -14 34 -16 46 -4 L42 -2 L44 2 L38 4 L38 8 L30 9 L26 12 C14 14 4 8 0 0 Z" transform="translate(2 135)"/>
      <path d="M0 0 C10 -14 34 -16 46 -4 L42 -2 L44 2 L38 4 L38 8 L30 9 L26 12 C14 14 4 8 0 0 Z" transform="translate(-2 135) scale(-1 1)"/>
      <path d="M0 0 C12 -18 42 -20 58 -5 L53 -2 L55 3 L48 5 L48 10 L38 11 L33 15 C18 17 5 10 0 0 Z" transform="translate(2 185)"/>
      <path d="M0 0 C12 -18 42 -20 58 -5 L53 -2 L55 3 L48 5 L48 10 L38 11 L33 15 C18 17 5 10 0 0 Z" transform="translate(-2 185) scale(-1 1)"/>
      <path d="M0 0 C12 -18 42 -20 58 -5 L53 -2 L55 3 L48 5 L48 10 L38 11 L33 15 C18 17 5 10 0 0 Z" transform="translate(2 240) rotate(10)"/>
      <path d="M0 0 C12 -18 42 -20 58 -5 L53 -2 L55 3 L48 5 L48 10 L38 11 L33 15 C18 17 5 10 0 0 Z" transform="translate(-2 240) scale(-1 1) rotate(10)"/>
    </g>
    <g stroke="#235c22" stroke-width="1"><path d="M4 135 L44 131 M-4 135 L-44 131 M4 185 L54 180 M-4 185 L-54 180"/></g>
  </g>

  <!-- 2: banana leaf: long oblong blade, thick midrib, many parallel side veins, torn edges -->
  <g transform="translate(330 150) rotate(-60)">
    <clipPath id="bananaClip"><path d="M-120 0 C-110 -32 90 -40 125 -4 L125 4 C90 40 -110 32 -120 0 Z"/></clipPath>
    <path d="M-120 0 C-110 -32 90 -40 125 -4 L125 4 C90 40 -110 32 -120 0 Z" fill="#5fb04a" stroke="#2e6e24" stroke-width="2"/>
    <path d="M-140 0 L125 0" stroke="#a8c86a" stroke-width="6"/>
    <g stroke="#2e6e24" stroke-width="1.3" clip-path="url(#bananaClip)">
      <path d="M-100 0 L-90 -26 M-80 0 L-70 -30 M-60 0 L-50 -32 M-40 0 L-30 -34 M-20 0 L-10 -35 M0 0 L10 -35 M20 0 L30 -34 M40 0 L50 -32 M60 0 L70 -29 M80 0 L90 -25 M100 0 L108 -18"/>
      <path d="M-100 0 L-90 26 M-80 0 L-70 30 M-60 0 L-50 32 M-40 0 L-30 34 M-20 0 L-10 35 M0 0 L10 35 M20 0 L30 34 M40 0 L50 32 M60 0 L70 29 M80 0 L90 25 M100 0 L108 18"/>
    </g>
    <!-- tears in the blade -->
    <g stroke="#fff" stroke-width="3"><path d="M-35 -34 L-45 -10 M25 -34 L15 -12 M-15 35 L-25 12 M55 31 L45 10"/></g>
  </g>

  <!-- 3: banyan leaves: three thick, broad, oval, glossy dark-green leaves with pale veins -->
  <g transform="translate(550 160)">
    <g stroke="#1b4a1e" stroke-width="2">
      <path d="M0 80 C-70 40 -80 -40 -40 -90 C10 -60 20 20 0 80 Z" fill="#1f5e2a" transform="rotate(-25)"/>
      <path d="M0 80 C-60 30 -55 -60 0 -100 C55 -60 60 30 0 80 Z" fill="#256b30"/>
      <path d="M0 80 C70 40 80 -40 40 -90 C-10 -60 -20 20 0 80 Z" fill="#1f5e2a" transform="rotate(25)"/>
    </g>
    <g stroke="#bfe0a8" stroke-width="2" fill="none">
      <path d="M0 80 L0 -95"/>
      <path d="M0 40 L-30 15 M0 40 L30 15 M0 10 L-34 -18 M0 10 L34 -18 M0 -20 L-30 -50 M0 -20 L30 -50"/>
    </g>
    <g stroke="#bfe0a8" stroke-width="1.6" fill="none">
      <path d="M0 80 C-25 20 -38 -40 -40 -88" transform="rotate(-25)"/>
      <path d="M0 80 C25 20 38 -40 40 -88" transform="rotate(25)"/>
    </g>
    <g fill="#ffffff" opacity="0.25"><ellipse cx="-12" cy="-40" rx="8" ry="26"/></g>
    <path d="M0 80 L0 110" stroke="#6b5a2a" stroke-width="5"/>
  </g>

  <!-- 4: peepal leaf: heart-shaped with long drip tip, fine veins -->
  <g transform="translate(770 175)">
    <path d="M0 95 C-30 70 -85 40 -80 -10 C-76 -45 -40 -60 -12 -70 C-6 -90 -2 -110 0 -125 C2 -110 6 -90 12 -70 C40 -60 76 -45 80 -10 C85 40 30 70 0 95 Z" fill="#7cc35a" stroke="#356e28" stroke-width="2"/>
    <g stroke="#356e28" stroke-width="1.5" fill="none">
      <path d="M0 115 L0 -120"/>
      <path d="M0 70 C-25 55 -55 40 -68 20 M0 70 C25 55 55 40 68 20 M0 40 C-25 25 -55 5 -72 -15 M0 40 C25 25 55 5 72 -15 M0 10 C-20 -5 -45 -25 -60 -42 M0 10 C20 -5 45 -25 60 -42 M0 -25 C-12 -35 -25 -50 -32 -60 M0 -25 C12 -35 25 -50 32 -60"/>
    </g>
  </g>
</svg>
