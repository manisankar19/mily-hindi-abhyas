    <path d="M154 272 C152 240 205 238 202 272 C196 258 170 252 154 272 Z" fill="#5a3218"/>
    <path d="M154 270 C146 290 150 305 158 310" fill="none" stroke="#5a3218" stroke-width="6"/>
