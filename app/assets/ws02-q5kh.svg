    <circle cx="661" cy="349" r="4" fill="#e53935"/>
    <circle cx="632" cy="364" r="2.5" fill="#222"/><circle cx="647" cy="364" r="2.5" fill="#222"/>
    <path d="M632 374 Q640 381 648 374" fill="none" stroke-width="2"/>
