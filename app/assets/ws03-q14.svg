<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 820 460" role="img">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#111"/>
    </marker>
    <g id="lf"><path d="M0 0 C10 -7 30 -7 42 0 C30 7 10 7 0 0 Z" fill="#2f8a3a" stroke="#1d5e26" stroke-width="1.2"/><path d="M2 0 L40 0" stroke="#1d5e26" stroke-width="1"/></g>
    <g id="mg"><path d="M0 -14 C12 -14 16 0 12 10 C8 20 -6 20 -10 10 C-14 0 -10 -14 0 -14 Z" fill="#f6a623" stroke="#b86e0c" stroke-width="1.5"/><path d="M-4 -10 C-2 -6 2 -6 4 -10" stroke="#e98a10" stroke-width="2" fill="none"/><path d="M0 -14 L0 -20" stroke="#5a3a1a" stroke-width="2"/></g>
  </defs>
  <rect x="-20" width="820" height="460" fill="#ffffff"/>
  <!-- grass -->
  <ellipse cx="470" cy="425" rx="190" ry="22" fill="#9ccc5a"/>
  <!-- trunk and branches -->
  <path d="M440 425 C448 370 446 320 430 270 L470 270 C462 320 470 370 500 425 Z" fill="#8a5a2b" stroke="#5a3a1a" stroke-width="2"/>
  <path d="M440 290 C410 260 380 240 340 225 M462 285 C490 250 530 235 580 220 M450 275 C450 240 455 210 460 180" stroke="#7a4d22" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- crown -->
  <g fill="#3f9a45" stroke="#2a6e30" stroke-width="2">
    <circle cx="350" cy="190" r="70"/><circle cx="440" cy="140" r="85"/><circle cx="550" cy="170" r="80"/>
    <circle cx="610" cy="230" r="55"/><circle cx="320" cy="250" r="50"/><circle cx="470" cy="230" r="70"/>
  </g>
  <!-- visible individual leaves around the edge and at arrow 1 -->
  <g>
    <use href="#lf" transform="translate(255 150) rotate(-160)"/>
    <use href="#lf" transform="translate(262 175) rotate(170)"/>
    <use href="#lf" transform="translate(300 115) rotate(-130)"/>
    <use href="#lf" transform="translate(268 125) rotate(-150)"/>
    <use href="#lf" transform="translate(380 70) rotate(-100)"/>
    <use href="#lf" transform="translate(520 70) rotate(-70)"/>
    <use href="#lf" transform="translate(630 120) rotate(-40)"/>
    <use href="#lf" transform="translate(660 210) rotate(-10)"/>
    <use href="#lf" transform="translate(275 270) rotate(160)"/>
    <use href="#lf" transform="translate(320 160) rotate(-170)"/>
    <use href="#lf" transform="translate(330 140) rotate(-150)"/>
    <use href="#lf" transform="translate(420 110) rotate(-120)"/>
    <use href="#lf" transform="translate(500 120) rotate(-60)"/>
    <use href="#lf" transform="translate(560 140) rotate(-30)"/>
    <use href="#lf" transform="translate(470 200) rotate(20)"/>
    <use href="#lf" transform="translate(380 230) rotate(160)"/>
  </g>
  <!-- mangoes (none near arrow 1) -->
  <use href="#mg" transform="translate(470 175)"/>
  <use href="#mg" transform="translate(530 205)"/>
  <use href="#mg" transform="translate(410 200)"/>
  <use href="#mg" transform="translate(600 175)"/>
  <use href="#mg" transform="translate(500 110)"/>
  <use href="#mg" transform="translate(360 250)"/>
  <use href="#mg" transform="translate(585 262)"/>
  <use href="#mg" transform="translate(440 255)"/>
  <!-- arrow 1: to the leaves, upper-left -->
  <line x1="120" y1="150" x2="300" y2="160" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <!-- arrow 2: to a mango on the right -->
  <line x1="120" y1="262" x2="568" y2="262" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <!-- empty numbered label boxes -->
  <rect x="12" y="125" width="105" height="48" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="10" cy="125" r="15" fill="#1f4fa0"/><text x="10" y="131" font-size="17" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="12" y="238" width="105" height="48" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="10" cy="238" r="15" fill="#1f4fa0"/><text x="10" y="244" font-size="17" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
</svg>
