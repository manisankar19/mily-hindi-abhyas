<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340" role="img">
  <!-- ground -->
  <rect x="0" y="318" width="240" height="22" fill="#cfc8b8"/>
  <ellipse cx="120" cy="320" rx="78" ry="7" fill="#9e9686"/>
  <!-- black base / plinth -->
  <rect x="52" y="282" width="136" height="36" rx="3" fill="#1d1d1d"/>
  <rect x="60" y="276" width="120" height="10" fill="#2b2b2b"/>
  <!-- red cylindrical body -->
  <rect x="64" y="96" width="112" height="182" fill="#d0201b"/>
  <rect x="64" y="96" width="18" height="182" fill="#e8493f" opacity="0.85"/>
  <rect x="156" y="96" width="20" height="182" fill="#a3140f" opacity="0.9"/>
  <rect x="64" y="96" width="112" height="182" fill="none" stroke="#5a0a07" stroke-width="3"/>
  <!-- dark band under the cap -->
  <rect x="58" y="82" width="124" height="18" fill="#1d1d1d"/>
  <!-- cap ledge -->
  <path d="M44 82 L196 82 L184 66 L56 66 Z" fill="#b01a15" stroke="#5a0a07" stroke-width="3" stroke-linejoin="round"/>
  <!-- domed top -->
  <path d="M56 66 Q56 14 120 12 Q184 14 184 66 Z" fill="#d0201b" stroke="#5a0a07" stroke-width="3"/>
  <path d="M74 58 Q78 28 112 22" fill="none" stroke="#f2766d" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="12" r="6" fill="#a3140f" stroke="#5a0a07" stroke-width="2"/>
  <!-- mail slot with hood -->
  <rect x="88" y="116" width="64" height="8" rx="2" fill="#7d100c"/>
  <rect x="90" y="122" width="60" height="14" rx="2" fill="#111"/>
  <!-- envelope symbol plate -->
  <rect x="84" y="158" width="72" height="50" rx="4" fill="#fff6e0" stroke="#5a0a07" stroke-width="3"/>
  <path d="M84 162 L120 190 L156 162" fill="none" stroke="#5a0a07" stroke-width="3" stroke-linejoin="round"/>
  <!-- small door panel lines -->
  <rect x="88" y="222" width="64" height="40" rx="3" fill="none" stroke="#7d100c" stroke-width="2.5"/>
  <circle cx="144" cy="242" r="3.5" fill="#1d1d1d"/>
</svg>
